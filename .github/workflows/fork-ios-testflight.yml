name: Tyne iOS TestFlight

# Builds the shipped flavour (canary) as Tyne for iOS and uploads it to App Store Connect,
# where it appears in TestFlight once Apple has processed it.
#
# The signing material lives in the `tyne-testflight` environment, which only the `tyne`
# branch may use: an Apple Distribution certificate (TYNE_IOS_DIST_P12, base64, and its
# password), one App Store provisioning profile per bundle ID (TYNE_IOS_PROFILE_*, base64),
# and an App Store Connect API key (TYNE_ASC_KEY_P8, TYNE_ASC_KEY_ID, TYNE_ASC_ISSUER_ID)
# for the upload. The certificate and profiles expire on 2027-10-14.
#
# The runner and Xcode are read from upstream's iOS workflow, which the nightly rebase keeps
# current, and Flutter is the latest stable, as in upstream's workflow. So none of them need
# bumping here. If upstream renames its workflow, the `toolchain` job says so and stops.
# The repository variable TYNE_IOS_RUNNER (a JSON label list, e.g. ["cherry-ios"]) runs the
# build on a Mac of the maintainers' instead, with the Xcode at TYNE_IOS_DEVELOPER_DIR, or
# /Applications/Xcode.app when that is not set (tyne-chat/tyne#892). The upload runs on
# TYNE_IOS_UPLOAD_RUNNER when set, else on upstream's runner, never on the build's runner: the
# build runs third-party code, and on a Mac of our own its account persists between runs, so
# the App Store Connect key goes to a runner in a separate account (tyne-chat/tyne#893).
#
# The `build` job keeps the signed IPA as an artifact for a day, and the `upload` job sends it
# to App Store Connect. When only the upload fails (Apple refused it on 2026-11-19 until a new
# agreement was accepted), "Re-run failed jobs" repeats the upload alone, in a few minutes,
# with the same build number, instead of the whole 40-minute build. The artifact can be
# downloaded by anyone who can see this public repository; an App Store-signed IPA installs
# only through TestFlight or the App Store.
#
# On a Mac of our own (`runner.environment` self-hosted), the build skips GitHub's cache for
# Flutter and pub and downloads from Google and pub.dev instead, and the upload job takes the
# IPA from a folder on the same Mac instead of the artifact: GitHub's artifact and cache storage
# reaches that Mac at about 2 MB/s (tyne-chat/tyne#892).
#
# `destination: phone` builds a test build for the registered test iPhones instead: Ad Hoc
# profiles (TYNE_IOS_ADHOC_PROFILE_*, made with the maintainers' make_adhoc_profiles.py), no
# upload and no artifact. It needs TYNE_IOS_RUNNER: the IPA is left on that Mac, where an agent
# installs it on the phone over the network (tyne-chat/tyne#896).

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: "Version shown in TestFlight (CFBundleShortVersionString). Empty: pubspec.yaml's version."
        required: false
        default: ""
      destination:
        description: "testflight: upload to App Store Connect. phone: an Ad Hoc build installed on the test iPhone from the maintainers' Mac."
        required: false
        default: testflight
        type: choice
        options:
          - testflight
          - phone

concurrency:
  group: fork-ios-testflight
  cancel-in-progress: false

jobs:
  toolchain:
    name: Read upstream's iOS toolchain
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.read.outputs.runner }}
      developer_dir: ${{ steps.read.outputs.developer_dir }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Read the runner and Xcode
        id: read
        env:
          DESTINATION: ${{ inputs.destination }}
          OWN_RUNNER: ${{ vars.TYNE_IOS_RUNNER }}
        run: |
          set -euo pipefail
          if [ "$DESTINATION" = phone ] && [ -z "$OWN_RUNNER" ]; then
            echo "::error::A phone build installs from the maintainers' Mac; set TYNE_IOS_RUNNER first"
            exit 1
          fi
          workflow=.github/workflows/ios-canary-testflight.yml
          runner="$(sed -n 's/^ *runs-on: *//p' "$workflow" | head -n 1)"
          developer_dir="$(sed -n 's/^ *DEVELOPER_DIR: *//p' "$workflow" | head -n 1)"
          if [ -z "$runner" ] || [ -z "$developer_dir" ]; then
            echo "::error::Could not read the runner and Xcode from $workflow"
            exit 1
          fi
          echo "::notice::Runner $runner, Xcode at $developer_dir"
          echo "runner=$runner" >> "$GITHUB_OUTPUT"
          echo "developer_dir=$developer_dir" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ inputs.destination == 'phone' && 'Build for the test iPhone' || 'Build for TestFlight' }}
    needs: toolchain
    runs-on: ${{ vars.TYNE_IOS_RUNNER && fromJSON(vars.TYNE_IOS_RUNNER) || needs.toolchain.outputs.runner }}
    timeout-minutes: 120
    environment: tyne-testflight
    outputs:
      build_name: ${{ steps.version.outputs.build_name }}
      build_number: ${{ steps.version.outputs.build_number }}
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      DEVELOPER_DIR: ${{ vars.TYNE_IOS_RUNNER && (vars.TYNE_IOS_DEVELOPER_DIR || '/Applications/Xcode.app/Contents/Developer') || needs.toolchain.outputs.developer_dir }}
      BUNDLE_ID: chat.tyne.app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Show the toolchain
        run: xcodebuild -version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Fork: GitHub's cache storage is slow from a Mac of our own; download from Google there.
          cache: ${{ runner.environment != 'self-hosted' }}

      # Fork: on a Mac of our own pub downloads from pub.dev, faster than GitHub's cache storage.
      - name: Restore pub cache
        if: runner.environment != 'self-hosted'
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Give the iOS project Tyne's identity
        env:
          TEAM_ID: ${{ secrets.TYNE_APPLE_TEAM_ID }}
        run: python3 tool/fork_ios_identity.py --team-id "$TEAM_ID"

      - name: Configure iOS store build tree
        run: dart tool/configure_build.dart --profile=ios-store

      - name: Set up Rust and native asset build hooks
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain stable
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            . "$HOME/.cargo/env"
          fi
          rustup target add aarch64-apple-ios
          # The markdown package builds its parser inside the fluxer submodule, whose
          # rust-toolchain.toml pins Rust (upstream's pin since tyne 1b346afbca, 2026-11-09);
          # that toolchain needs the iOS target too. Without it the build fails on the
          # parser's dependencies (itoa, serde_core, zmij), as on 2026-11-10.
          if [ -f fluxer/rust-toolchain.toml ]; then
            (cd fluxer && rustup target add aarch64-apple-ios)
          fi
          flutter config --enable-native-assets

      - name: Get dependencies
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      # Before the long build: a build that cannot read production's discovery document must
      # not reach TestFlight (tyne-chat/tyne#459). A network failure stops the release too.
      - name: Check production's discovery document
        run: |
          curl -fsS --max-time 20 -o "$RUNNER_TEMP/discovery.json" https://temple.hypersystem.xyz/api/.well-known/fluxer
          DISCOVERY_DOCUMENT="$RUNNER_TEMP/discovery.json" flutter test tool/check_discovery_document.dart

      - name: Import the distribution certificate
        env:
          P12: ${{ secrets.TYNE_IOS_DIST_P12 }}
          P12_PASSWORD: ${{ secrets.TYNE_IOS_DIST_P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/tyne.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 7200 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" \
            -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Install the provisioning profiles
        env:
          PROFILE_APP: ${{ inputs.destination == 'phone' && secrets.TYNE_IOS_ADHOC_PROFILE_APP || secrets.TYNE_IOS_PROFILE_APP }}
          PROFILE_NOTIFICATION_SERVICE: ${{ inputs.destination == 'phone' && secrets.TYNE_IOS_ADHOC_PROFILE_NOTIFICATION_SERVICE || secrets.TYNE_IOS_PROFILE_NOTIFICATION_SERVICE }}
          PROFILE_SHARE_EXTENSION: ${{ inputs.destination == 'phone' && secrets.TYNE_IOS_ADHOC_PROFILE_SHARE_EXTENSION || secrets.TYNE_IOS_PROFILE_SHARE_EXTENSION }}
          PROFILE_BROADCAST_EXTENSION: ${{ inputs.destination == 'phone' && secrets.TYNE_IOS_ADHOC_PROFILE_BROADCAST_EXTENSION || secrets.TYNE_IOS_PROFILE_BROADCAST_EXTENSION }}
          TEAM_ID: ${{ secrets.TYNE_APPLE_TEAM_ID }}
        shell: bash
        run: |
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          # target name, bundle ID, base64 profile
          while read -r target bundle variable; do
            profile="$RUNNER_TEMP/$target.mobileprovision"
            printf '%s' "${!variable}" | base64 --decode > "$profile"
            decoded="$(security cms -D -i "$profile")"
            uuid="$(plutil -extract UUID raw - <<< "$decoded")"
            name="$(plutil -extract Name raw - <<< "$decoded")"
            app_id="$(plutil -extract Entitlements.application-identifier raw - <<< "$decoded")"
            expires="$(plutil -extract ExpirationDate raw - <<< "$decoded")"
            if [ "$app_id" != "$TEAM_ID.$bundle" ]; then
              echo "::error::The profile for $target is for $app_id, not $TEAM_ID.$bundle"
              exit 1
            fi
            cp "$profile" "$PROFILES_DIR/$uuid.mobileprovision"
            echo "$target: $name ($uuid), expires $expires"
            echo "PROFILE_NAME_$target=$name" >> "$GITHUB_ENV"
          done <<EOF
          Runner $BUNDLE_ID PROFILE_APP
          NotificationService $BUNDLE_ID.NotificationService PROFILE_NOTIFICATION_SERVICE
          ShareExtension $BUNDLE_ID.ShareExtension PROFILE_SHARE_EXTENSION
          BroadcastExtension $BUNDLE_ID.BroadcastExtension PROFILE_BROADCAST_EXTENSION
          EOF

      - name: Sign the canary release configuration with the distribution profiles
        env:
          TEAM_ID: ${{ secrets.TYNE_APPLE_TEAM_ID }}
        run: |
          ruby -e 'require "xcodeproj"' 2>/dev/null || gem install xcodeproj --no-document
          ruby <<'RUBY'
          require "xcodeproj"
          project = Xcodeproj::Project.open("ios/Runner.xcodeproj")
          signed = []
          project.targets.each do |target|
            profile = ENV["PROFILE_NAME_#{target.name}"]
            next if profile.nil? || profile.empty?
            config = target.build_configurations.find { |c| c.name == "Release-canary" }
            abort "#{target.name} has no Release-canary configuration" if config.nil?
            settings = config.build_settings
            settings["CODE_SIGN_STYLE"] = "Manual"
            settings["DEVELOPMENT_TEAM"] = ENV.fetch("TEAM_ID")
            settings["CODE_SIGN_IDENTITY"] = "Apple Distribution"
            settings["CODE_SIGN_IDENTITY[sdk=iphoneos*]"] = "Apple Distribution"
            settings["PROVISIONING_PROFILE_SPECIFIER"] = profile
            # The extensions carry their own version (1.0, 1); App Store Connect warns unless
            # they match the app's, which comes from FLUTTER_BUILD_NAME and _NUMBER.
            unless target.name == "Runner"
              settings["MARKETING_VERSION"] = "$(FLUTTER_BUILD_NAME)"
              settings["CURRENT_PROJECT_VERSION"] = "$(FLUTTER_BUILD_NUMBER)"
            end
            signed << target.name
          end
          abort "signed #{signed.inspect}, expected four targets" unless signed.size == 4
          project.save
          puts "Manual signing for #{signed.join(', ')}"
          RUBY

      - name: Work out the version
        id: version
        env:
          BUILD_NAME_INPUT: ${{ inputs.build_name }}
        run: |
          BUILD_NAME="$BUILD_NAME_INPUT"
          if [ -z "$BUILD_NAME" ]; then
            BUILD_NAME="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          fi
          if ! [[ "$BUILD_NAME" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::'$BUILD_NAME' is not a version App Store Connect accepts (up to three numbers)"
            exit 1
          fi
          # Unique and rising across runs and re-runs of this workflow.
          BUILD_NUMBER=$(( ${{ github.run_number }} * 100 + ${{ github.run_attempt }} ))
          echo "BUILD_NAME=$BUILD_NAME" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "build_name=$BUILD_NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "::notice::Tyne $BUILD_NAME ($BUILD_NUMBER)"

      - name: Build Flutter for iOS
        run: |
          flutter build ios --release --flavor canary --no-codesign \
            --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER" \
            --dart-define-from-file=tool/dart_defines/canary.json \
            --dart-define=PUSH_PROVIDER=apns \
            --dart-define=BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Archive
        run: |
          xcodebuild archive -quiet \
            -workspace ios/Runner.xcworkspace \
            -scheme canary \
            -configuration Release-canary \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Tyne.xcarchive" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            FLUTTER_BUILD_NAME="$BUILD_NAME" \
            FLUTTER_BUILD_NUMBER="$BUILD_NUMBER"

      - name: Export the IPA
        env:
          TEAM_ID: ${{ secrets.TYNE_APPLE_TEAM_ID }}
          # Fork: Ad Hoc ("release-testing") for the test iPhones, App Store Connect otherwise.
          EXPORT_METHOD: ${{ inputs.destination == 'phone' && 'release-testing' || 'app-store-connect' }}
          UPLOAD_SYMBOLS: ${{ inputs.destination == 'phone' && 'false' || 'true' }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>$EXPORT_METHOD</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>uploadSymbols</key><$UPLOAD_SYMBOLS/>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_NAME_Runner</string>
              <key>$BUNDLE_ID.NotificationService</key><string>$PROFILE_NAME_NotificationService</string>
              <key>$BUNDLE_ID.ShareExtension</key><string>$PROFILE_NAME_ShareExtension</string>
              <key>$BUNDLE_ID.BroadcastExtension</key><string>$PROFILE_NAME_BroadcastExtension</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Tyne.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
          IPA="$(ls "$RUNNER_TEMP"/export/*.ipa)"
          echo "IPA=$IPA" >> "$GITHUB_ENV"
          ls -lh "$IPA"

      - name: Check what was signed
        run: |
          mkdir -p "$RUNNER_TEMP/ipa" && cd "$RUNNER_TEMP/ipa"
          unzip -q "$IPA"
          app="$(ls -d Payload/*.app)"
          app_version="$(plutil -extract CFBundleShortVersionString raw "$app/Info.plist") ($(plutil -extract CFBundleVersion raw "$app/Info.plist"))"
          for bundle in "$app" "$app"/PlugIns/*.appex; do
            echo "== $bundle: $(plutil -extract CFBundleIdentifier raw "$bundle/Info.plist") $(plutil -extract CFBundleShortVersionString raw "$bundle/Info.plist") ($(plutil -extract CFBundleVersion raw "$bundle/Info.plist"))"
            codesign -d --entitlements - --xml "$bundle" 2>/dev/null | plutil -p -
            version="$(plutil -extract CFBundleShortVersionString raw "$bundle/Info.plist") ($(plutil -extract CFBundleVersion raw "$bundle/Info.plist"))"
            if [ "$version" != "$app_version" ]; then
              echo "::warning::$bundle is version $version, the app $app_version"
            fi
          done
          aps="$(codesign -d --entitlements - --xml "$app" 2>/dev/null | plutil -extract aps-environment raw - || true)"
          if [ "$aps" != "production" ]; then
            echo "::error::The app is signed with aps-environment '$aps'; TestFlight builds need 'production' for push"
            exit 1
          fi

      - name: Keep the IPA for the upload job
        if: inputs.destination != 'phone'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: tyne-ios-ipa
          path: ${{ env.IPA }}
          if-no-files-found: error
          retention-days: 1

      # Fork: on a Mac of our own, leave the IPA in a folder only this runner's account can write:
      # for the upload runner on the same Mac (saving the slow artifact download), or, for a phone
      # build, for the agent there that installs it on the test iPhone (tyne-chat/tyne#892, #896).
      - name: Leave the IPA on this Mac
        if: runner.environment == 'self-hosted'
        env:
          DESTINATION: ${{ inputs.destination }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$DESTINATION" = phone ]; then
            drop=/Users/Shared/tyne-ios-builds
            if [ ! -d "$drop" ] || [ ! -w "$drop" ]; then
              echo "::error::No folder $drop for the phone install on this runner"
              exit 1
            fi
            rm -f "$drop"/*.ipa
            cp "$IPA" "$drop/Tyne-$BUILD_NAME-$BUILD_NUMBER.ipa"
            ls -l "$drop"
            echo "::notice::Left Tyne $BUILD_NAME ($BUILD_NUMBER) for the test iPhone."
          else
            handoff=/Users/Shared/tyne-handoff-ios
            if [ -d "$handoff" ] && [ -w "$handoff" ]; then
              find "$handoff" -mindepth 1 -maxdepth 1 ! -name "$RUN_ID" -exec rm -rf {} +
              rm -rf "${handoff:?}/$RUN_ID"
              mkdir "$handoff/$RUN_ID"
              cp "$IPA" "$handoff/$RUN_ID/"
              ls -l "$handoff/$RUN_ID"
            else
              echo "::notice::No handoff folder on this runner; the upload job downloads the artifact."
            fi
          fi

      - name: Clean up signing material
        if: always()
        run: |
          [ -n "${KEYCHAIN_PATH:-}" ] && security delete-keychain "$KEYCHAIN_PATH" || true
          rm -rf "$HOME/.appstoreconnect/private_keys" "$HOME/Library/MobileDevice/Provisioning Profiles" "$RUNNER_TEMP"/*.mobileprovision

  upload:
    name: Upload to TestFlight
    needs: [toolchain, build]
    if: inputs.destination != 'phone'
    runs-on: ${{ vars.TYNE_IOS_UPLOAD_RUNNER && fromJSON(vars.TYNE_IOS_UPLOAD_RUNNER) || needs.toolchain.outputs.runner }}
    timeout-minutes: 30
    environment: tyne-testflight
    env:
      DEVELOPER_DIR: ${{ vars.TYNE_IOS_UPLOAD_RUNNER && (vars.TYNE_IOS_DEVELOPER_DIR || '/Applications/Xcode.app/Contents/Developer') || needs.toolchain.outputs.developer_dir }}
      BUILD_NAME: ${{ needs.build.outputs.build_name }}
      BUILD_NUMBER: ${{ needs.build.outputs.build_number }}
    steps:
      # Fork: when the build ran on the same Mac, take the IPA it left there (tyne-chat/tyne#892).
      - name: Take the IPA from this Mac
        id: local
        if: runner.environment == 'self-hosted'
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          from="/Users/Shared/tyne-handoff-ios/$RUN_ID"
          if ls "$from"/*.ipa >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/export"
            rm -f "$RUNNER_TEMP"/export/*.ipa
            cp "$from"/*.ipa "$RUNNER_TEMP/export/"
            ls -l "$RUNNER_TEMP/export"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No IPA of this run on this Mac; downloading the artifact."
          fi

      - name: Fetch the IPA from the build job
        if: steps.local.outputs.found != 'true'
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: tyne-ios-ipa
          path: ${{ runner.temp }}/export

      - name: Upload to App Store Connect
        env:
          ASC_KEY_P8: ${{ secrets.TYNE_ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.TYNE_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.TYNE_ASC_ISSUER_ID }}
        run: |
          IPA="$(ls "$RUNNER_TEMP"/export/*.ipa)"
          ls -lh "$IPA"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s\n' "$ASC_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "::notice::Uploaded Tyne $BUILD_NAME ($BUILD_NUMBER). It shows in TestFlight once Apple has processed it."

      - name: Clean up the API key
        if: always()
        run: rm -rf "$HOME/.appstoreconnect/private_keys"
