# SPDX-License-Identifier: AGPL-3.0-or-later
name: Nightly Rebase & AI Conflict Resolver

# SCHEDULING NOTE:
# GitHub Actions disables `on: schedule` triggers on forked repositories at the
# platform level. Since this repo is a public fork of fluxerapp/flutter_client,
# cron schedules defined here will NEVER fire regardless of workflow state.
#
# Nightly runs are instead triggered by a cron schedule in the standalone
# (non-fork) repository: chiaracoetzee/workflow-scheduler
# That repo dispatches this workflow daily at 4:35 AM PDT (11:35 UTC) via
# `gh workflow run`.

on:
  workflow_dispatch:
    inputs:
      test_issue:
        description: 'Only test the issue account: skip the rebase, open a test escalation as tyne-rebase[bot] and close it. Starts no other repository.'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Dry run (rebase and run tests, but do NOT push to remote)'
        required: true
        default: false
        type: boolean
      force_test_agent:
        description: 'Run a self-test of the agent model connection before the rebase'
        required: false
        default: false
        type: boolean
      agent:
        description: 'The agent that resolves conflicts and repairs failed gates: claude (Claude Opus 5.5 through Claude Code, with a review of its conflict resolution) or gemini (Gemini 3.8 Flash). The next repository is started with the same one.'
        required: false
        default: 'claude'
        type: choice
        options:
          - claude
          - gemini
      force_tests:
        description: 'Force execution of baseline and post-rebase tests even if 0 commits behind upstream'
        required: false
        default: false
        type: boolean
      smoke:
        description: 'Smoke run: skip the baseline gate, rebase and update submodules, then stop before the test gate. Runs even if 0 commits behind. Never pushes.'
        required: false
        default: false
        type: boolean

# Read-only by default. The rebase job runs code nobody here controls (upstream's new commits,
# installs and build scripts, the test suites, the agent), so it holds no token that can write:
# its GITHUB_TOKEN reads, and the private tools come in with a read-only deploy key. The publish
# job is the only one with WORKFLOW_TOKEN, and it runs nothing but GitHub's own actions and
# publish_result.py from a fresh checkout of the tools, which checks what the rebase job left
# before pushing it. Every action is pinned to a commit, with its version in a comment.
permissions:
  contents: read

jobs:
  nightly-rebase:
    if: ${{ !inputs.test_issue }}
    runs-on: ubuntu-24.04
    timeout-minutes: 135

    # The agent this run uses (tyne-tools rebase/pipeline_issues.py); the publish job needs it too, for
    # the model its issues name and for starting the next repository with the same agent.
    env:
      REBASE_AGENT_PROVIDER: ${{ inputs.agent }}
    steps:
      - name: Checkout tyne
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: tyne
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Checkout shared rebase tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tyne-chat/tyne-tools
          ref: main
          ssh-key: ${{ secrets.TOOLS_DEPLOY_KEY }}
          persist-credentials: false
          path: .shared_tools

      - name: Stage shared rebase tools to /tmp
        run: |
          mkdir -p /tmp/rebase_tools
          cp -r .shared_tools/* /tmp/rebase_tools/
          rm -rf .shared_tools

      - name: Set up Python for AI Resolver
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install Google Antigravity SDK
        if: ${{ inputs.agent != 'claude' }}
        run: pip install google-antigravity

      # The Claude agent (tyne-tools rebase/claude_agent.py) runs Claude Code, pinned to the version
      # its rules were checked with, into a directory of its own.
      - name: Install Claude Code
        if: ${{ inputs.agent == 'claude' }}
        run: |
          npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/claude-code" @anthropic-ai/claude-code@2.1.310
          echo "$RUNNER_TEMP/claude-code/node_modules/.bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/claude-code/node_modules/.bin/claude" --version

      - name: Verify the agent's model connection
        if: ${{ inputs.force_test_agent == true }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          python /tmp/rebase_tools/rebase/rebase_agent.py --self-test
          echo "Resting 10s to ensure clean quota before rebase..."
          sleep 10

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Set up Rust (Native Markdown Parser)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master on 2026-10-24
        with:
          toolchain: stable

      - name: Enable native assets
        run: flutter config --enable-native-assets

      # The pipeline runs as one step per phase, so this page shows which phase is
      # running, how long each took, and whether the repair agent was needed (its
      # steps are skipped when it was not). The phases share their state through
      # /tmp/rebase_pipeline_state.json; see rebase_orchestrator.py --phase.
      - name: Pipeline settings
        run: |
          FLAGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          if [ "${{ inputs.force_tests }}" = "true" ] || [ "${{ inputs.force_test_agent }}" = "true" ]; then
            FLAGS="$FLAGS --force-tests"
          fi
          if [ "${{ inputs.smoke }}" = "true" ]; then
            FLAGS="$FLAGS --force-tests --skip-baseline --stop-after-codegen"
          fi
          echo "REBASE_ARGS=--profile flutter --time-budget-minutes 125 --result-dir /tmp/rebase_result $FLAGS" >> "$GITHUB_ENV"

      # Only the agent steps (3a, 4a, ...) get the model credentials: the other steps run upstream's
      # installs, builds and tests. Within an agent step, the orchestrator keeps them from every command
      # but the agent's, and Claude Code from the commands it runs (CLAUDE_CODE_SUBPROCESS_ENV_SCRUB).
      - name: "1. Check upstream and tag a backup"
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python /tmp/rebase_tools/rebase/rebase_orchestrator.py $REBASE_ARGS --phase prepare

      - name: "2. Baseline tests (before the rebase)"
        id: baseline
        if: ${{ steps.prepare.outputs.skip_rebase != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python /tmp/rebase_tools/rebase/rebase_orchestrator.py $REBASE_ARGS --phase baseline

      - name: "3. Rebase onto upstream"
        id: rebase
        if: ${{ steps.prepare.outputs.skip_rebase != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python /tmp/rebase_tools/rebase/rebase_orchestrator.py $REBASE_ARGS --phase rebase

      - name: "3a. Agent: resolve conflicts"
        id: resolve_conflicts
        if: ${{ steps.prepare.outputs.skip_rebase != 'true' && steps.rebase.outputs.needs_agent == 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python /tmp/rebase_tools/rebase/rebase_orchestrator.py $REBASE_ARGS --phase resolve-conflicts

      - name: "4. Dependencies and code generation"
        id: codegen
        if: ${{ steps.prepare.outputs.skip_rebase != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python /tmp/rebase_tools/rebase/rebase_orchestrator.py $REBASE_ARGS --phase codegen

      - name: "4a. Agent: repair code generation"
        id: repair_codegen
        if: ${{ steps.prepare.outputs.skip_rebase != 'true' && steps.codegen.outputs.needs_agent == 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python /tmp/rebase_tools/rebase/rebase_orchestrator.py $REBASE_ARGS --phase repair-codegen

      - name: "5. Tests and analysis"
        id: unit
        if: ${{ steps.prepare.outputs.skip_rebase != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python /tmp/rebase_tools/rebase/rebase_orchestrator.py $REBASE_ARGS --phase unit

      - name: "5a. Agent: repair tests"
        id: repair_unit
        if: ${{ steps.prepare.outputs.skip_rebase != 'true' && steps.unit.outputs.needs_agent == 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python /tmp/rebase_tools/rebase/rebase_orchestrator.py $REBASE_ARGS --phase repair-unit

      - name: "6. Hand the rebased branch to the publish job"
        id: push
        if: ${{ steps.prepare.outputs.skip_rebase != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python /tmp/rebase_tools/rebase/rebase_orchestrator.py $REBASE_ARGS --phase push

      - name: Upload the result for the publish job
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rebase-result
          if-no-files-found: ignore
          path: /tmp/rebase_result
          retention-days: 14

      - name: Upload AI Agent Logs & Artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rebase-agent-logs
          path: |
            /tmp/rebase_transcript.md
            /tmp/rebase_escalation_reason.md
            /tmp/test_failures.log
            /tmp/antigravity_data

  # Pushes the rebased branch and the backup tag, opens the escalation and absorbed-commit issues
  # and starts the next repository's rebase: everything that needs WORKFLOW_TOKEN. It runs no code
  # from the rebase job or the rebased branch; publish_result.py says what it checks.
  publish:
    needs: nightly-rebase
    # Also after a failed, crashed or timed-out rebase job: the escalation and the next link's
    # start happen here.
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    # Each step has a time limit of its own below the job's, so a hung step fails instead of the
    # job being cut off: the last step then still reports it and starts the next link. The step
    # limits add up to 40 minutes; the rest is for setting up and cleaning up the job.
    timeout-minutes: 50

    # The agent this run uses (tyne-tools rebase/pipeline_issues.py); the publish job needs it too, for
    # the model its issues name and for starting the next repository with the same agent.
    env:
      REBASE_AGENT_PROVIDER: ${{ inputs.agent }}
    steps:
      # Escalations and the absorbed-commits issue are opened as tyne-rebase[bot] (the Tyne Rebase
      # App: Issues only, installed on tyne-chat/tyne), not as WORKFLOW_TOKEN's account. If this
      # step fails, they fall back to WORKFLOW_TOKEN (tyne-tools rebase/pipeline_issues.py). First,
      # so that the last-resort step below has it too.
      - name: Token for the pipeline's issues
        id: issues-token
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: Iv23lislBoXAblKx3tR3
          private-key: ${{ secrets.REBASE_APP_KEY }}
          owner: tyne-chat
          repositories: tyne
          permission-issues: write

      # The checkouts are tried more than once, each with a time limit: on 2026-11-03 the checkout
      # of the branch hung in `git fetch` for the whole job during an outage of GitHub's git
      # service, so nothing was pushed, no issue was opened and the next link never started
      # (tyne-chat/tyne#486).
      - name: Checkout shared rebase tools
        id: tools-1
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tyne-chat/tyne-tools
          ref: main
          ssh-key: ${{ secrets.TOOLS_DEPLOY_KEY }}
          persist-credentials: false
          path: tools

      - name: Checkout shared rebase tools (second try)
        if: ${{ steps.tools-1.outcome == 'failure' }}
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tyne-chat/tyne-tools
          ref: main
          ssh-key: ${{ secrets.TOOLS_DEPLOY_KEY }}
          persist-credentials: false
          path: tools

      - name: Checkout tyne
        id: repo-1
        continue-on-error: true
        timeout-minutes: 4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: tyne
          fetch-depth: 0
          token: ${{ secrets.WORKFLOW_TOKEN }}
          path: repo

      - name: Checkout tyne (second try)
        id: repo-2
        if: ${{ steps.repo-1.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: tyne
          fetch-depth: 0
          token: ${{ secrets.WORKFLOW_TOKEN }}
          path: repo

      - name: Checkout tyne (third try)
        if: ${{ steps.repo-2.outcome == 'failure' }}
        timeout-minutes: 4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: tyne
          fetch-depth: 0
          token: ${{ secrets.WORKFLOW_TOKEN }}
          path: repo

      # Missing when the rebase job stopped before it wrote anything; the next step escalates then.
      - name: Download the rebase job's result
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rebase-result
          path: result

      - name: Check, push, report and start the next repository
        timeout-minutes: 12
        working-directory: repo
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
          ISSUES_GH_TOKEN: ${{ steps.issues-token.outputs.token }}
          REBASE_JOB: ${{ needs.nightly-rebase.result }}
          REBASE_PUBLISH_STATE: ${{ runner.temp }}/publish-state
          TEST_ISSUE: ${{ inputs.test_issue }}
          DRY_RUN: ${{ inputs.dry_run || inputs.smoke }}
        run: |
          FLAGS=""
          if [ "$DRY_RUN" = "true" ]; then
            FLAGS="--dry-run"
          fi
          # Last: a test-issue run does nothing else, whatever dry_run says.
          if [ "$TEST_ISSUE" = "true" ]; then
            FLAGS="--test-issue"
          fi
          python3 ../tools/rebase/publish_result.py --profile flutter --result-dir ../result --rebase-job "$REBASE_JOB" $FLAGS

      # Only when a step above failed or ran out of its time. The publishing step leaves a mark when
      # it finishes (it also fails on purpose after an escalation), so this reports only what it did
      # not get to: the issue, and the next link unless it was already started.
      - name: Report a publishing job that did not get through
        if: ${{ failure() && !inputs.test_issue }}
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
          ISSUES_GH_TOKEN: ${{ steps.issues-token.outputs.token }}
          REBASE_PUBLISH_STATE: ${{ runner.temp }}/publish-state
          DRY_RUN: ${{ inputs.dry_run || inputs.smoke }}
          NEXT_REPO: ""
        run: |
          FLAGS=""
          if [ "$DRY_RUN" = "true" ]; then
            FLAGS="--dry-run"
          fi
          if [ -f tools/rebase/publish_result.py ]; then
            python3 tools/rebase/publish_result.py --profile flutter --result-dir result --fallback $FLAGS
            exit $?
          fi
          echo "::error::The rebase tools could not be checked out; nothing was pushed."
          if [ -n "$NEXT_REPO" ] && [ "$DRY_RUN" != "true" ]; then
            gh workflow run nightly-rebase.yaml --repo "$NEXT_REPO" --ref automation || true
          fi
          GH_TOKEN="${ISSUES_GH_TOKEN:-$GH_TOKEN}" gh issue create --repo tyne-chat/tyne \
            --title "⚠️ Nightly Rebase Failed (${GITHUB_REPOSITORY#*/}): Human Intervention Required ($(date -u +%F))" \
            --body "The publishing job of run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} could not check out the rebase tools, so nothing was pushed. \`gh run rerun ${GITHUB_RUN_ID} --repo ${GITHUB_REPOSITORY} --failed\` runs it again." || true
          exit 1
